<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline'; img-src 'self' data:;" />
    <title>Clawd Tracker — Settings</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="settings">
    <div class="shell">
      <div class="header">
        <span>Settings</span>
      </div>

      <div class="section-title">Profiles</div>
      <div id="profile-list"></div>
      <div style="display:flex; gap:8px;">
        <button class="ghost" id="add">+ Add profile</button>
        <button class="ghost" id="auto-detect">Auto-detect</button>
      </div>

      <div class="section-title">Polling</div>
      <div class="form-row">
        <label for="interval">Interval (s)</label>
        <input type="number" id="interval" min="10" step="5" />
      </div>

      <div class="section-title">Startup</div>
      <div class="form-row">
        <label for="autostart">Launch at login</label>
        <input type="checkbox" id="autostart" />
      </div>

      <div style="display:flex; gap:8px; margin-top: 16px;">
        <button id="save">Save</button>
        <button class="ghost" id="cancel">Close</button>
      </div>

      <div id="status" class="footer" style="margin-top:8px;"></div>
    </div>

    <script type="module">
      import { getSnapshot, saveConfig, autoDetect, escapeHtml } from "./app.js";

      const listEl = document.getElementById("profile-list");
      const intervalEl = document.getElementById("interval");
      const autostartEl = document.getElementById("autostart");
      const statusEl = document.getElementById("status");

      let profiles = [];
      let pollInterval = 60;
      let autostart = true;

      async function doSave() {
        await saveConfig({
          profiles,
          poll_interval_s: Math.max(10, parseInt(intervalEl.value || "60", 10)),
          autostart: autostartEl.checked,
        });
      }

      function rowTemplate(p, idx) {
        const div = document.createElement("div");
        div.className = "profile-edit";

        const hint = document.createElement("div");
        hint.style.cssText = "font-size:11px;color:var(--fg-dim);margin-top:6px;line-height:1.4;";
        hint.innerHTML = `Reads credentials from ${
          navigator.userAgent.includes("Mac") ? "macOS Keychain" : "<code>.credentials.json</code>"
        }. If usage is missing, run <code>CLAUDE_CONFIG_DIR=${escapeHtml(p.config_dir || "~/.claude")} claude /login</code> in your terminal.`;

        div.innerHTML = `
          <div class="profile-edit-row">
            <input type="text" data-field="name" placeholder="Display name" value="${escapeHtml(p.name)}" />
            <input type="text" data-field="config_dir" placeholder="~/.claude-personal" value="${escapeHtml(p.config_dir)}" />
            <button class="ghost" data-action="remove">×</button>
          </div>
          <div style="display:flex; gap:12px; margin-top:8px; font-size:11px; color: var(--fg-dim); align-items:center;">
            <label><input type="checkbox" data-field="enabled" ${p.enabled ? "checked" : ""}/> enabled</label>
            <label><input type="checkbox" data-field="show_in_tray" ${p.show_in_tray !== false ? "checked" : ""}/> show in menu bar</label>
            <span data-field="id" style="margin-left:auto;">id: ${escapeHtml(p.id)}</span>
          </div>
          <div style="display:flex; gap:8px; margin-top:8px; font-size:11px; color: var(--fg-dim); align-items:center;">
            <label style="white-space:nowrap;">Menubar label</label>
            <input type="text" data-field="tray_label" placeholder="e.g. J or Per (defaults to truncated name)" maxlength="12" value="${escapeHtml(p.tray_label || "")}" style="flex:1;" />
          </div>
        `;
        div.appendChild(hint);

        div.querySelectorAll("[data-field]").forEach((el) => {
          el.addEventListener("input", () => {
            const f = el.dataset.field;
            if (f === "id") return;
            if (el.type === "checkbox") {
              profiles[idx][f] = el.checked;
            } else if (f === "tray_label") {
              // Empty input → null, so serde treats it as "no override" and
              // the field is skipped when serializing.
              profiles[idx][f] = el.value === "" ? null : el.value;
            } else {
              profiles[idx][f] = el.value;
            }
          });
        });
        div.querySelector('[data-action="remove"]').addEventListener("click", () => {
          profiles.splice(idx, 1);
          render();
        });
        return div;
      }

      function render() {
        listEl.innerHTML = "";
        profiles.forEach((p, i) => listEl.appendChild(rowTemplate(p, i)));
      }

      async function init() {
        const snap = await getSnapshot();
        if (snap?.config) {
          profiles = snap.config.profiles || [];
          pollInterval = snap.config.poll_interval_s || 60;
          autostart = snap.config.autostart ?? true;
        }
        intervalEl.value = pollInterval;
        autostartEl.checked = autostart;
        render();
      }

      function newId() {
        return "p" + Math.random().toString(36).slice(2, 8);
      }

      document.getElementById("add").addEventListener("click", () => {
        profiles.push({
          id: newId(),
          name: "New account",
          config_dir: "~/.claude",
          enabled: true,
          show_in_tray: true,
          use_macos_keychain: false,
          tray_label: null,
        });
        render();
      });

      document.getElementById("auto-detect").addEventListener("click", async () => {
        const dirs = await autoDetect();
        // Dedup by basename so `~/.claude-X` and `/Users/u/.claude-X` match.
        const basename = (p) => (p || "").split("/").filter(Boolean).pop() || "";
        const existing = new Set(profiles.map((p) => basename(p.config_dir)));
        let added = 0;
        for (const dir of dirs) {
          const tail = basename(dir);
          if (!tail || existing.has(tail)) continue;
          profiles.push({
            id: tail,
            name: tail.replace(/^\./, "").replace(/^claude-?/, "") || "default",
            config_dir: dir,
            enabled: true,
            show_in_tray: true,
            use_macos_keychain: false,
            tray_label: null,
          });
          added++;
        }
        render();
        statusEl.textContent = added ? `Found ${added} new profile(s).` : "No new profiles found.";
      });

      document.getElementById("save").addEventListener("click", async () => {
        try {
          await doSave();
          statusEl.textContent = "Saved.";
          setTimeout(() => (statusEl.textContent = ""), 1800);
        } catch (e) {
          statusEl.textContent = "Save failed: " + e;
        }
      });

      async function saveAndHide() {
        try { await doSave(); } catch(e) { /* best-effort */ }
        window.__TAURI__.window.getCurrentWindow().hide();
      }

      document.getElementById("cancel").addEventListener("click", saveAndHide);

      // Intercept the OS ✕ button: hide instead of destroy so the window can reopen.
      window.__TAURI__.window.getCurrentWindow().onCloseRequested(async (event) => {
        event.preventDefault();
        await saveAndHide();
      });

      init();
    </script>
  </body>
</html>
