<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline'; img-src 'self' data:;" />
    <title>Clawd Widget</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="widget">
    <div class="shell drag">
      <div class="header">
        <span>Claude</span>
        <div class="actions">
          <button class="icon-btn no-drag" id="refresh" title="Refresh">↻</button>
        </div>
      </div>
      <div class="profiles no-drag" id="profiles"></div>
    </div>

    <script type="module">
      import {
        getSnapshot,
        refreshNow,
        renderProfile,
        onUsageUpdated,
        persistWidgetPos,
      } from "./app.js";

      const profilesEl = document.getElementById("profiles");
      const updatesById = new Map();

      function render() {
        profilesEl.innerHTML = "";
        for (const update of updatesById.values()) {
          profilesEl.appendChild(renderProfile(update, { compact: true }));
        }
      }

      async function init() {
        try {
          const snap = await getSnapshot();
          if (snap?.updates) {
            for (const u of snap.updates) updatesById.set(u.profile_id, u);
          }
        } catch (e) {
          console.error(e);
        }
        render();
        await onUsageUpdated((update) => {
          updatesById.set(update.profile_id, update);
          render();
        });
      }

      document.getElementById("refresh").addEventListener("click", () => refreshNow());

      // Persist window position when the user finishes dragging.
      let moveTimer = null;
      window.addEventListener("mouseup", async () => {
        clearTimeout(moveTimer);
        moveTimer = setTimeout(async () => {
          try {
            const win = window.__TAURI__.window.getCurrentWindow();
            const pos = await win.outerPosition();
            await persistWidgetPos(pos.x, pos.y);
          } catch (e) {}
        }, 250);
      });

      init();
    </script>
  </body>
</html>
